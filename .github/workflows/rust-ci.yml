name: CI

concurrency: ci-${{ github.ref }}

on:
    push:
        branches: [develop]
        paths:
            - "src/**/*.rs"
            - .rust-version
            - ".github/workflows/**"
    workflow_dispatch:
    repository_dispatch:
        types:
            - common-published

jobs:
    tests:
        name: Build/test on ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux
                      os: ubuntu-latest
                      target: x86_64-unknown-linux-musl

        steps:
            - uses: actions/checkout@v6
            - name: Get language version
              id: get_lang_version
              run: |
                    v=$(cat .rust-version)
                    echo "lang_version=$v" >> $GITHUB_OUTPUT
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Build
              uses: actions-rs/cargo@v1
              with:
                  use-cross: true
                  command: build
                  args: --verbose --release --target ${{ matrix.target }}
            - name: Test
              uses: actions-rs/cargo@v1
              with:
                  use-cross: true
                  command: test
                  args: --verbose --release --target ${{ matrix.target }}
            # Native host toolchain, not the musl cross target above - tarpaulin
            # instruments locally and doesn't need the cross-compiled test run.
            - name: Install cargo-tarpaulin
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-tarpaulin
            - name: Coverage (tarpaulin)
              run: |
                  mkdir -p coverage
                  cargo tarpaulin --engine llvm --out Html --out Xml --output-dir coverage | tee coverage/tarpaulin-output.txt
            - name: Coverage summary
              run: |
                  echo "## Rust coverage" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  cat coverage/tarpaulin-output.txt >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
            - name: Upload coverage artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
            # Warn-only: continue-on-error means this never blocks the job, only shows
            # as a flagged step.
            - name: Coverage threshold
              continue-on-error: true
              run: |
                  LINE_RATE=$(grep -oE '<coverage [^>]*line-rate="[0-9.]+"' coverage/cobertura.xml \
                      | grep -oE 'line-rate="[0-9.]+"' | grep -oE '[0-9.]+' || true)
                  LINE_RATE=${LINE_RATE:-0}
                  PCT=$(awk -v r="$LINE_RATE" 'BEGIN { printf "%.2f", r*100 }')
                  echo "Coverage: ${PCT}%"
                  awk -v pct="$PCT" 'BEGIN { exit !(pct+0 >= 0) }'
            # Written into coverage/ so the publish step below carries it to GitHub Pages.
            # destination_dir: coverage, not the root, since the docs job below already
            # publishes to the gh-pages root with no destination_dir of its own -
            # colliding there would wipe one or the other on every run.
            - name: Coverage badge
              continue-on-error: true
              run: |
                  LINE_RATE=$(grep -oE '<coverage [^>]*line-rate="[0-9.]+"' coverage/cobertura.xml \
                      | grep -oE 'line-rate="[0-9.]+"' | grep -oE '[0-9.]+' || true)
                  LINE_RATE=${LINE_RATE:-0}
                  PCT=$(awk -v r="$LINE_RATE" 'BEGIN { printf "%.2f", r*100 }')
                  COLOR=$(awk -v p="$PCT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
                  printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
                      "$PCT" "$COLOR" > coverage/coverage-badge.json
            - name: Publish coverage
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./coverage
                  destination_dir: coverage
            - name: Bump version and push tag
              id: bump_version
              uses: anothrNick/github-tag-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  WITH_V: false
                  DEFAULT_BUMP: patch
            - name: Commit and push
              run: |
                  git config --global user.email "ci@sweetrpg.com"
                  git config --global user.name "SweetRPG CI"
                  sed -i 's/^version = ".*"$/version = "'${{ steps.bump_version.outputs.new_tag }}'"/' Cargo.toml
                  git add Cargo.toml
                  git commit -m "Update Cargo.toml on ${{ github.ref_name }} with version: ${{ steps.bump_version.outputs.new_tag }}"
                  git push origin
            - name: Run release-plz
              uses: release-plz/action@v0.5
              with:
                  command: release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_KEY }}

    docs:
        needs: [tests]
        runs-on: ubuntu-latest
        concurrency: docs
        steps:
            - uses: actions/checkout@v6
            - name: Get language version
              id: get_lang_version
              run: |
                  v=$(cat .rust-version)
                  echo "lang_version=$v" >> $GITHUB_OUTPUT
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
                # with:
                #   targets: ${{ matrix.target }}
                #   rust-version: ${{ steps.get_lang_version.outputs.lang_version }}
            - name: Make docs
              run: |
                  cargo doc
            # keep_files: true - without it, this root-level publish (no destination_dir)
            # wipes the whole branch by default, deleting the tests job's coverage/
            # subfolder that ran moments earlier in the same workflow.
            - name: Publish docs
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./target/doc/sweetrpg_model_core/
                  keep_files: true

#    release:
#        needs: [tests]
#        runs-on: ubuntu-latest
#        permissions:
#            contents: write
#        steps:
#            - uses: actions/checkout@v6
#              with:
#                  fetch-depth: 0
#            - name: Install Rust
#              uses: dtolnay/rust-toolchain@stable
#            - name: Check version
#              run: |
#                    cat Cargo.toml

    notify:
        needs: [tests]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - repo: api-core.rs
                    - repo: catalog-api
                    - repo: catalog-data.rs
                    - repo: catalog-data-processor
                    - repo: catalog-objects.rs
                    - repo: catalog-web
                    - repo: client.rs
                    - repo: data-api
                    - repo: data-objects.rs
                    - repo: db.rs
                    - repo: initiative-api
                    - repo: initiative-data.rs
                    - repo: initiative-objects.rs
                    - repo: initiative-web
                    - repo: kv-api
                    - repo: kv-data.rs
                    - repo: kv-expression-processor
                    - repo: kv-key-processor
                    - repo: kv-objects.rs
                    - repo: kv-value-calculator
                    - repo: kv-web
                    - repo: library-api
                    - repo: library-data.rs
                    - repo: library-objects.rs
                    - repo: library-web
                    - repo: main-web
                    - repo: model-core.rs
                    - repo: shared-web
                    - repo: web-core.rs
        steps:
            - uses: juztcode/repo-ditpatch-action@v1
              continue-on-error: true
              with:
                  event-type: model-core-published
                  token: ${{ secrets.REPO_ACCESS_TOKEN }}
                  repository: sweetrpg/${{ matrix.repo }}
